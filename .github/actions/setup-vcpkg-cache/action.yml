name: Setup vcpkg cache
description: Restores the vcpkg cache and saves it only for main branch runs.

inputs:
  key:
    description: Workflow and job-specific cache key component.
    required: true
  path:
    description: Path to the vcpkg cache directory.
    required: false
    default: ~/.cache/vcpkg

runs:
  using: composite
  steps:
    - name: Get vcpkg cache identity
      id: tool-info
      uses: ./.github/actions/get-build-tool-info
      with:
        vcpkg: 'true'

    - name: Configure vcpkg cache identity
      id: configure
      shell: python3 {0}
      env:
        VCPKG_CACHE_PATH: ${{ inputs.path }}
        VCPKG_CACHE_VARIANT: ${{ inputs.key }}
      run: |
        import hashlib
        import json
        import os
        import shutil
        from pathlib import Path

        runner_os = os.environ["RUNNER_OS"]
        namespace = f'{runner_os}-{os.environ["RUNNER_ARCH"]}-{os.environ["VCPKG_CACHE_VARIANT"]}'
        prefix = f"vcpkg-cache-v2-{namespace}-"
        if runner_os == "Windows":
            compiler = shutil.which("cl")
            if not compiler:
                raise RuntimeError("Initialize the selected MSVC environment before setting up the vcpkg cache.")
            # Servicing updates can change cl.exe without changing VCToolsVersion.
            compiler_hash = hashlib.sha256(Path(compiler).read_bytes()).hexdigest()
            toolchain = {"cl": compiler_hash}
            for name in ("VCToolsVersion", "WindowsSDKVersion", "VSCMD_ARG_HOST_ARCH", "VSCMD_ARG_TGT_ARCH"):
                value = os.environ.get(name, "").strip().rstrip("\\/")
                if not value:
                    raise RuntimeError(f"Missing {name}; initialize the selected MSVC environment first.")
                toolchain[name] = value
            identity = hashlib.sha256(json.dumps(toolchain, sort_keys=True).encode()).hexdigest()
            prefix = f"vcpkg-cache-v3-{namespace}-{identity}-"
            print(f"Selected MSVC compiler: {compiler}")
            print(f"vcpkg cache toolchain: {json.dumps(toolchain, sort_keys=True)}")
            cache_path = Path(os.environ["VCPKG_CACHE_PATH"]).expanduser().resolve()
            cache_path.mkdir(parents=True, exist_ok=True)
            with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
                env.write(f"VCPKG_DEFAULT_BINARY_CACHE={cache_path}\n")
        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
            output.write(f"prefix={prefix}\n")

    - name: Restore and save vcpkg cache
      if: github.ref == 'refs/heads/main'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: >-
          ${{ steps.configure.outputs.prefix }}${{ steps.tool-info.outputs.vcpkg-sha512 }}-${{
            hashFiles(
              'cmake/vcpkg.json',
              'cmake/vcpkg-configuration.json',
              'cmake/vcpkg-ports/**',
              'tools/python/util/vcpkg_helpers.py'
            )
          }}
        restore-keys: |
          ${{ steps.configure.outputs.prefix }}
        path: ${{ inputs.path }}

    - name: Restore vcpkg cache
      if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        key: >-
          ${{ steps.configure.outputs.prefix }}${{ steps.tool-info.outputs.vcpkg-sha512 }}-${{
            hashFiles(
              'cmake/vcpkg.json',
              'cmake/vcpkg-configuration.json',
              'cmake/vcpkg-ports/**',
              'tools/python/util/vcpkg_helpers.py'
            )
          }}
        restore-keys: |
          ${{ steps.configure.outputs.prefix }}
        path: ${{ inputs.path }}
